<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" role="img" aria-label="Detailed pipeline: instructions and checking rules per stage"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9198a1"/></marker></defs><rect x=".5" y=".5" width="879" height="589" rx="10" fill="#161b22" stroke="#30363d"/><text x="24" y="32" font-size="16" font-weight="600" text-anchor="start">The pipeline in detail: what each stage is asked to do, and what blocks</text><text x="196" y="66" font-size="13" font-weight="700" text-anchor="start" class="m">Instruction</text><text x="532" y="66" font-size="13" font-weight="700" text-anchor="start" class="m">Strict rule (checked)</text><rect x="24" y="84" width="160" height="56" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="36" y="108" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">1 Extraction</text><text x="36" y="126" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet, no web</text><rect x="196" y="84" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="84" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="102" font-size="12" font-weight="400" text-anchor="start">· inventory of every sample before writing</text><text x="206" y="118" font-size="12" font-weight="400" text-anchor="start">· base route + one branch per compared variant</text><text x="206" y="134" font-size="12" font-weight="400" text-anchor="start">· v1 grid: every slot extracted or declared</text><text x="542" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ every value has its verbatim quote</text><text x="542" y="118" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ nothing inferred, converted or inherited unstated</text><text x="542" y="134" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ when unsure: write a doubt, literal reading</text><line x1="104" y1="140" x2="104" y2="149" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="150" width="160" height="56" rx="8" fill="#21262d" stroke="#9aa5b1" stroke-width="1.5"/><text x="36" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#9aa5b1">2 Automatic check</text><text x="36" y="192" font-size="12" font-weight="400" text-anchor="start" class="m">load.py</text><rect x="196" y="150" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="150" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="168" font-size="12" font-weight="400" text-anchor="start">· quotes, structure, grid, physical ranges</text><text x="206" y="184" font-size="12" font-weight="400" text-anchor="start">· rerun by the orchestrator, never taken on trust</text><text x="542" y="168" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ quote not in the text → rejected</text><text x="542" y="184" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ number missing from its quote → rejected</text><text x="542" y="200" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ slot neither filled nor declared → rejected</text><line x1="104" y1="206" x2="104" y2="215" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="216" width="160" height="56" rx="8" fill="#3a2a10" stroke="#e0a43c" stroke-width="1.5"/><text x="36" y="240" font-size="14" font-weight="700" text-anchor="start" fill="#e0a43c">3 Review</text><text x="36" y="258" font-size="12" font-weight="400" text-anchor="start" class="m">Opus orchestrator</text><rect x="196" y="216" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="216" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="234" font-size="12" font-weight="400" text-anchor="start">· every doubt settled by re-reading the passage</text><text x="206" y="250" font-size="12" font-weight="400" text-anchor="start">· 1 paper in 5 re-read value by value</text><text x="542" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ drawn by PMCID hash (not chosen)</text><text x="542" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ errors &gt; 5% → batch re-read + new rule</text><line x1="104" y1="272" x2="104" y2="281" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="282" width="160" height="56" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="36" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">4a Fidelity</text><text x="36" y="324" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet, no web</text><rect x="196" y="282" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="282" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="300" font-size="12" font-weight="400" text-anchor="start">· reads the paper BEFORE the extraction</text><text x="206" y="316" font-size="12" font-weight="400" text-anchor="start">· looks for: wrong, attribution, missing, inferred</text><text x="542" y="300" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ finding without an exact passage → rejected</text><text x="542" y="316" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ changes nothing</text><line x1="104" y1="338" x2="104" y2="347" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="348" width="160" height="56" rx="8" fill="#3a2a10" stroke="#e0a43c" stroke-width="1.5"/><text x="36" y="372" font-size="14" font-weight="700" text-anchor="start" fill="#e0a43c">4b Science</text><text x="36" y="390" font-size="12" font-weight="400" text-anchor="start" class="m">Opus + web</text><rect x="196" y="348" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="348" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="366" font-size="12" font-weight="400" text-anchor="start">· stoichiometry, redox, thermal, solubility</text><text x="206" y="382" font-size="12" font-weight="400" text-anchor="start">· comparison with founding methods</text><text x="542" y="366" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ calculations laid out to be recounted</text><text x="542" y="382" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ source with DOI, or declared not found</text><line x1="104" y1="404" x2="104" y2="413" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="414" width="160" height="56" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="36" y="438" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">5 Correction</text><text x="36" y="456" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet</text><rect x="196" y="414" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="414" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="432" font-size="12" font-weight="400" text-anchor="start">· applies the orchestrator's written decisions</text><text x="206" y="448" font-size="12" font-weight="400" text-anchor="start">· by script, on the paper's JSON only</text><text x="542" y="432" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ the text decides, never the majority</text><text x="542" y="448" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ no value lost (checked by diff)</text><text x="542" y="464" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ paper's error → annotation, not a fix</text><line x1="104" y1="470" x2="104" y2="479" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="480" width="160" height="56" rx="8" fill="#21262d" stroke="#9aa5b1" stroke-width="1.5"/><text x="36" y="504" font-size="14" font-weight="700" text-anchor="start" fill="#9aa5b1">6 Batch audit</text><text x="36" y="522" font-size="12" font-weight="400" text-anchor="start" class="m">every 50 papers</text><rect x="196" y="480" width="324" height="56" rx="6" fill="#0d1117" stroke="#30363d"/><rect x="532" y="480" width="324" height="56" rx="6" fill="#3d1f19" stroke="#30363d"/><text x="206" y="498" font-size="12" font-weight="400" text-anchor="start">· every quote re-checked at its position</text><text x="206" y="514" font-size="12" font-weight="400" text-anchor="start">· 30 values and 5 stoichiometries re-read, sources</text><text x="542" y="498" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ next batch only at 0 blocking finding</text><text x="542" y="514" font-size="12" font-weight="400" text-anchor="start" fill="#e6edf3">✓ accepted finding = written explanation</text><text x="24" y="574" font-size="12" font-weight="400" text-anchor="start" class="m">Each agent keeps a log of its choices; a mistake seen twice becomes a written rule in the instructions.</text></svg>