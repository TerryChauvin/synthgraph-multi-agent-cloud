<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="Key figures of the database"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9198a1"/></marker></defs><rect x=".5" y=".5" width="879" height="235" rx="10" fill="#161b22" stroke="#30363d"/><rect x="24" y="20" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="24" y="32" width="4" height="68" rx="2" fill="#6cc184"/><text x="42" y="58" font-size="28" font-weight="700" text-anchor="start" fill="#6cc184">500</text><text x="42" y="80" font-size="14" font-weight="600" text-anchor="start">papers closed</text><text x="42" y="98" font-size="11.5" font-weight="400" text-anchor="start" class="m">10 audited batches of 50</text><rect x="236" y="20" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="236" y="32" width="4" height="68" rx="2" fill="#6cc184"/><text x="254" y="58" font-size="28" font-weight="700" text-anchor="start" fill="#6cc184">5,338</text><text x="254" y="80" font-size="14" font-weight="600" text-anchor="start">synthesis routes</text><text x="254" y="98" font-size="11.5" font-weight="400" text-anchor="start" class="m">1,382 base + 3,956 branches</text><rect x="448" y="20" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="448" y="32" width="4" height="68" rx="2" fill="#6cc184"/><text x="466" y="58" font-size="28" font-weight="700" text-anchor="start" fill="#6cc184">39,350</text><text x="466" y="80" font-size="14" font-weight="600" text-anchor="start">measured outcomes</text><text x="466" y="98" font-size="11.5" font-weight="400" text-anchor="start" class="m">incl. 6,997 read off figures</text><rect x="660" y="20" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="660" y="32" width="4" height="68" rx="2" fill="#6cc184"/><text x="678" y="58" font-size="28" font-weight="700" text-anchor="start" fill="#6cc184">12,731</text><text x="678" y="80" font-size="14" font-weight="600" text-anchor="start">synthesis parameters</text><text x="678" y="98" font-size="11.5" font-weight="400" text-anchor="start" class="m">9,546 steps, 7,714 reagents</text><rect x="24" y="124" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="24" y="136" width="4" height="68" rx="2" fill="#9aa5b1"/><text x="42" y="162" font-size="28" font-weight="700" text-anchor="start" fill="#9aa5b1">95,053</text><text x="42" y="184" font-size="14" font-weight="600" text-anchor="start">quotes checked</text><text x="42" y="202" font-size="11.5" font-weight="400" text-anchor="start" class="m">100% found verbatim</text><rect x="236" y="124" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="236" y="136" width="4" height="68" rx="2" fill="#9aa5b1"/><text x="254" y="162" font-size="28" font-weight="700" text-anchor="start" fill="#9aa5b1">11,285</text><text x="254" y="184" font-size="14" font-weight="600" text-anchor="start">values re-read by hand</text><text x="254" y="202" font-size="11.5" font-weight="400" text-anchor="start" class="m">16 wrong, all corrected</text><rect x="448" y="124" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="448" y="136" width="4" height="68" rx="2" fill="#e98a74"/><text x="466" y="162" font-size="28" font-weight="700" text-anchor="start" fill="#e98a74">28,631</text><text x="466" y="184" font-size="14" font-weight="600" text-anchor="start">"not stated" cells</text><text x="466" y="202" font-size="11.5" font-weight="400" text-anchor="start" class="m">absence is recorded</text><rect x="660" y="124" width="200" height="92" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="660" y="136" width="4" height="68" rx="2" fill="#45b3c4"/><text x="678" y="162" font-size="28" font-weight="700" text-anchor="start" fill="#45b3c4">91.5%</text><text x="678" y="184" font-size="14" font-weight="600" text-anchor="start">blind agreement</text><text x="678" y="202" font-size="11.5" font-weight="400" text-anchor="start" class="m">parameters, 20 papers</text></svg>