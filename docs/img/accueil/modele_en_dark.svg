<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="Database data model"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9198a1"/></marker></defs><rect x=".5" y=".5" width="879" height="349" rx="10" fill="#161b22" stroke="#30363d"/><text x="24" y="34" font-size="16" font-weight="600" text-anchor="start">Data model: a base route, branches that change one variation, every value with its quote</text><rect x="24" y="60" width="150" height="76" rx="8" fill="#16321f" stroke="#6cc184" stroke-width="1.5"/><text x="36" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#6cc184">Publication</text><text x="36" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">PMCID, DOI</text><text x="36" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">CC licence, URL</text><rect x="214" y="60" width="190" height="94" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="226" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Base route</text><text x="226" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">material, formula, family</text><text x="226" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">method, yield</text><text x="226" y="136" font-size="12" font-weight="400" text-anchor="start" class="m">kind: material, device…</text><rect x="374" y="68" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="385" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><rect x="214" y="222" width="190" height="94" rx="8" fill="#3a2a10" stroke="#e0a43c" stroke-width="1.5"/><text x="226" y="244" font-size="14" font-weight="700" text-anchor="start" fill="#e0a43c">Branch</text><text x="226" y="264" font-size="12" font-weight="400" text-anchor="start" class="m">variant tested by the author</text><text x="226" y="281" font-size="12" font-weight="400" text-anchor="start" class="m">variation: 150 → 180 °C</text><text x="226" y="298" font-size="12" font-weight="400" text-anchor="start" class="m">failures kept (succeeded)</text><rect x="374" y="230" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="385" y="245" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><line x1="174" y1="98" x2="212" y2="98" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><path d="M309,222 L309,156" fill="none" stroke="#e0a43c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="318" y="194" font-size="12" font-weight="600" text-anchor="start" fill="#e0a43c">inherits</text><text x="318" y="209" font-size="11" font-weight="400" text-anchor="start" class="m">everything else</text><rect x="452" y="60" width="190" height="76" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="464" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Steps</text><text x="464" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">order, action, equipment</text><rect x="612" y="68" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="623" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><rect x="452" y="152" width="190" height="76" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="464" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Reagents</text><text x="464" y="194" font-size="12" font-weight="400" text-anchor="start" class="m">role, amount, purity</text><rect x="612" y="160" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="623" y="175" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><rect x="452" y="244" width="190" height="76" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="464" y="266" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Outcomes</text><text x="464" y="286" font-size="12" font-weight="400" text-anchor="start" class="m">property, value, conditions</text><text x="464" y="303" font-size="12" font-weight="400" text-anchor="start" class="m">from text or read off a figure</text><rect x="612" y="252" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="623" y="267" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><rect x="662" y="60" width="190" height="76" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="674" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Parameters</text><text x="674" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">value, unit, SI value</text><text x="674" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">T, t, pH, ramp…</text><rect x="822" y="68" width="22" height="18" rx="4" fill="#0d1117" stroke="#9aa5b1"/><text x="833" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#9aa5b1">❝</text><rect x="662" y="152" width="190" height="76" rx="8" fill="#3d1f19" stroke="#e98a74" stroke-width="1.5"/><text x="674" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#e98a74">Not stated</text><text x="674" y="194" font-size="12" font-weight="400" text-anchor="start" class="m">per step and reagent:</text><text x="674" y="211" font-size="12" font-weight="400" text-anchor="start" class="m">heating rate, pressure…</text><rect x="662" y="244" width="190" height="76" rx="8" fill="#21262d" stroke="#9aa5b1" stroke-width="1.5"/><text x="674" y="266" font-size="14" font-weight="700" text-anchor="start" fill="#9aa5b1">Annotations</text><text x="674" y="286" font-size="12" font-weight="400" text-anchor="start" class="m">reproducibility limits,</text><text x="674" y="303" font-size="12" font-weight="400" text-anchor="start" class="m">kept apart from data</text><path d="M404,98 L428,98 M428,98 L428,282" fill="none" stroke="#9198a1" stroke-width="1.6"/><line x1="428" y1="98" x2="450" y2="98" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><line x1="428" y1="190" x2="450" y2="190" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><line x1="428" y1="282" x2="450" y2="282" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><line x1="642" y1="98" x2="660" y2="98" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><path d="M547,136 L547,144 L652,144 L652,190 L660,190" fill="none" stroke="#e98a74" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><path d="M404,140 L416,140 L416,330 L757,330 L757,322" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="24" y="168" width="164" height="160" rx="8" fill="#0d1117" stroke="#9aa5b1" stroke-dasharray="4 3"/><text x="36" y="192" font-size="13" font-weight="700" text-anchor="start" fill="#9aa5b1">❝ = verbatim quote</text><text x="36" y="214" font-size="12" font-weight="400" text-anchor="start" class="m">found word for word</text><text x="36" y="230" font-size="12" font-weight="400" text-anchor="start" class="m">in the source text;</text><text x="36" y="246" font-size="12" font-weight="400" text-anchor="start" class="m">the number must appear</text><text x="36" y="262" font-size="12" font-weight="400" text-anchor="start" class="m">inside the quote;</text><text x="36" y="278" font-size="12" font-weight="400" text-anchor="start" class="m">SI conversion stored</text><text x="36" y="294" font-size="12" font-weight="400" text-anchor="start" class="m">apart, never in place</text><text x="36" y="310" font-size="12" font-weight="400" text-anchor="start" class="m">of the author's value.</text></svg>