<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Exemple d'une voie et de ses branches : Sb2S3 à 120, 150 et 180 °C"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9198a1"/></marker></defs><rect x=".5" y=".5" width="879" height="419" rx="10" fill="#161b22" stroke="#30363d"/><text x="24" y="34" font-size="16" font-weight="600" text-anchor="start">Exemple : PMC6199062, Sb₂S₃ hydrothermal, série en température (une voie de base, deux branches)</text><rect x="24" y="54" width="330" height="280" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="38" y="78" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Voie de base · Sb2S3-150</text><circle cx="46" cy="98" r="9" fill="#45b3c4"/><text x="46" y="102.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">1</text><text x="62" y="102" font-size="13" font-weight="700" text-anchor="start">dissoudre</text><text x="140" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">3 mmol L-cysteine · 15 min</text><circle cx="46" cy="126" r="9" fill="#45b3c4"/><text x="46" y="130.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">2</text><text x="62" y="130" font-size="13" font-weight="700" text-anchor="start">ajouter</text><text x="140" y="130" font-size="12" font-weight="400" text-anchor="start" class="m">2 mmol SbCl₃ · 35 min</text><circle cx="46" cy="154" r="9" fill="#45b3c4"/><text x="46" y="158.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">3</text><text x="62" y="158" font-size="13" font-weight="700" text-anchor="start">autoclave</text><text x="140" y="158" font-size="12" font-weight="400" text-anchor="start" class=