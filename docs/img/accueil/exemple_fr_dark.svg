nt-weight="400" text-anchor="start">nanowires</text><text x="388" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="388" y="242" width="84.0" height="12" rx="3" fill="#e98a74"/><text x="477.9525222551929" y="253" font-size="12" font-weight="700" text-anchor="start">643</text><text x="388" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="388" y="288" width="24.7" height="12" rx="3" fill="#e98a74"/><text x="418.6765578635015" y="299" font-size="12" font-weight="700" text-anchor="start">189</text><text x="388" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><rect x="542" y="54" width="158" height="280" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="554" y="78" font-size="20" font-weight="700" text-anchor="start" fill="#45b3c4">150 °C</text><text x="554" y="96" font-size="12" font-weight="400" text-anchor="start" class="m">voie de base</text><text x="554" y="122" font-size="11" font-weight="400" text-anchor="start" class="m">phase</text><text x="554" y="138" font-size="13" font-weight="600" text-anchor="start">Sb₂S₃ pur</text><text x="554" y="160" font-size="11" font-weight="400" text-anchor="start" class="m">morphologie</text><text x="554" y="176" font-size="12" font-weight="400" text-anchor="start">hollow interior,</text><text x="554" y="191" font-size="12" font-weight="400" text-anchor="start">microspheres built from</text><text x="554" y="206" font-size="12" font-weight="400" text-anchor="start">nanowires</text><text x="554" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="554" y="242" width="88.0" height="12" rx="3" fill="#45b3c4"/><text x="648.0" y="253" font-size="12" font-weight="700" text-anchor="start">674</text><text x="554" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="554" y="288" width="66.1" height="12" rx="3" fill="#45b3c4"/><text x="626.0652818991098" y="299" font-size="12" font-weight="700" text-anchor="start">506</text><text x="554" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><rect x="708" y="54" width="158" height="280" rx="8" fill="#3a2a10" stroke="#e0a43c" stroke-width="1.5"/><text x="720" y="78" font-size="20" font-weight="700" text-anchor="start" fill="#e0a43c">180 °C</text><text x="720" y="96" font-size="12" font-weight="400" text-anchor="start" class="m">branche : T changée</text><text x="720" y="122" font-size="11" font-weight="400" text-anchor="start" class="m">phase</text><text x="720" y="138" font-size="13" font-weight="600" text-anchor="start">Sb₂S₃ pur</text><text x="720" y="160" font-size="11" font-weight="400" text-anchor="start" class="m">morphologie</text><text x="720" y="176" font-size="12" font-weight="400" text-anchor="start">rough solid spheres</text><text x="720" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="720" y="242" width="69.5" height="12" rx="3" fill="#e0a43c"/><text x="795.459940652819" y="253" font-size="12" font-weight="700" text-anchor="start">532</text><text x="720" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="720" y="288" width="30.6" height="12" rx="3" fill="#e0a43c"/><text x="756.5519287833828" y="299" font-size="12" font-weight="700" text-anchor="start">234</text><text x="720" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><text x="24" y="362" font-size="12" font-weight="400" text-anchor="start">Lecture : à 120 °C, impureté d'oxychlorure (succeeded = false) ; à 150 °C, sphères creuses et meilleure tenue en cyclage.</text><text x="24" y="382" font-size="12" font-weight="400" text-anchor="start" class="m">Chaque nombre est lu dans extractions/PMC6199062.json, avec sa citation ; l'article donne aussi l'électrode et les piles (voies « dispositif »).</text><text x="24" y="402" font-size="11.5" font-weight="400" text-anchor="start" class="m">Requête : SELECT * FROM v_route_complete WHERE pmcid = 'PMC6199062' ORDER BY branch_label, step_order;</text></svg>