<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Example of a route and its branches: Sb2S3 at 120, 150 and 180 °C"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#9198a1}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9198a1"/></marker></defs><rect x=".5" y=".5" width="879" height="419" rx="10" fill="#161b22" stroke="#30363d"/><text x="24" y="34" font-size="16" font-weight="600" text-anchor="start">Example: PMC6199062, hydrothermal Sb₂S₃, temperature series (one base route, two branches)</text><rect x="24" y="54" width="330" height="280" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="38" y="78" font-size="14" font-weight="700" text-anchor="start" fill="#45b3c4">Base route · Sb2S3-150</text><circle cx="46" cy="98" r="9" fill="#45b3c4"/><text x="46" y="102.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">1</text><text x="62" y="102" font-size="13" font-weight="700" text-anchor="start">dissolve</text><text x="140" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">3 mmol L-cysteine · 15 min</text><circle cx="46" cy="126" r="9" fill="#45b3c4"/><text x="46" y="130.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">2</text><text x="62" y="130" font-size="13" font-weight="700" text-anchor="start">add</text><text x="140" y="130" font-size="12" font-weight="400" text-anchor="start" class="m">2 mmol SbCl₃ · 35 min</text><circle cx="46" cy="154" r="9" fill="#45b3c4"/><text x="46" y="158.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">3</text><text x="62" y="158" font-size="13" font-weight="700" text-anchor="start">autoclave</text><text x="140" y="158" font-size="12" font-weight="400" text-anchor="start" class="m">150 °C, 12 h</text><circle cx="46" cy="182" r="9" fill="#45b3c4"/><text x="46" y="186.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">4</text><text x="62" y="186" font-size="13" font-weight="700" text-anchor="start">wash</text><text x="140" y="186" font-size="12" font-weight="400" text-anchor="start" class="m">several times</text><circle cx="46" cy="210" r="9" fill="#45b3c4"/><text x="46" y="214.5" font-size="11" font-weight="700" text-anchor="middle" fill="#161b22">5</text><text x="62" y="214" font-size="13" font-weight="700" text-anchor="start">dry</text><text x="140" y="214" font-size="12" font-weight="400" text-anchor="start" class="m">80 °C, 5 h, vacuum</text><rect x="36" y="236" width="306" height="44" rx="6" fill="#0d1117" stroke="#9aa5b1" stroke-dasharray="4 3"/><text x="46" y="254" font-size="11.5" font-weight="400" text-anchor="start" fill="#9aa5b1">❝ …maintained at 150 °C for 12 h”</text><text x="46" y="271" font-size="11" font-weight="400" text-anchor="start" class="m">verbatim quote from the paper, checked by load.py</text><text x="38" y="322" font-size="12" font-weight="600" text-anchor="start" fill="#e98a74">21 "not stated" cells (heating rate, pH…)</text><rect x="376" y="54" width="158" height="280" rx="8" fill="#3d1f19" stroke="#e98a74" stroke-width="1.5"/><text x="388" y="78" font-size="20" font-weight="700" text-anchor="start" fill="#e98a74">120 °C</text><text x="388" y="96" font-size="12" font-weight="400" text-anchor="start" class="m">branch: T changed</text><text x="388" y="122" font-size="11" font-weight="400" text-anchor="start" class="m">phase</text><text x="388" y="138" font-size="13" font-weight="600" text-anchor="start" fill="#e98a74">Sb₂S₃ + Sb₈O₁₁Cl₂</text><text x="388" y="160" font-size="11" font-weight="400" text-anchor="start" class="m">morphology</text><text x="388" y="176" font-size="12" font-weight="400" text-anchor="start">densely aggregated</text><text x="388" y="191" font-size="12" font-weight="400" text-anchor="start">nanowires</text><text x="388" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="388" y="242" width="84.0" height="12" rx="3" fill="#e98a74"/><text x="477.9525222551929" y="253" font-size="12" font-weight="700" text-anchor="start">643</text><text x="388" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="388" y="288" width="24.7" height="12" rx="3" fill="#e98a74"/><text x="418.6765578635015" y="299" font-size="12" font-weight="700" text-anchor="start">189</text><text x="388" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><rect x="542" y="54" width="158" height="280" rx="8" fill="#11303a" stroke="#45b3c4" stroke-width="1.5"/><text x="554" y="78" font-size="20" font-weight="700" text-anchor="start" fill="#45b3c4">150 °C</text><text x="554" y="96" font-size="12" font-weight="400" text-anchor="start" class="m">base route</text><text x="554" y="122" font-size="11" font-weight="400" text-anchor="start" class="m">phase</text><text x="554" y="138" font-size="13" font-weight="600" text-anchor="start">pure Sb₂S₃</text><text x="554" y="160" font-size="11" font-weight="400" text-anchor="start" class="m">morphology</text><text x="554" y="176" font-size="12" font-weight="400" text-anchor="start">hollow interior,</text><text x="554" y="191" font-size="12" font-weight="400" text-anchor="start">microspheres built from</text><text x="554" y="206" font-size="12" font-weight="400" text-anchor="start">nanowires</text><text x="554" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="554" y="242" width="88.0" height="12" rx="3" fill="#45b3c4"/><text x="648.0" y="253" font-size="12" font-weight="700" text-anchor="start">674</text><text x="554" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="554" y="288" width="66.1" height="12" rx="3" fill="#45b3c4"/><text x="626.0652818991098" y="299" font-size="12" font-weight="700" text-anchor="start">506</text><text x="554" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><rect x="708" y="54" width="158" height="280" rx="8" fill="#3a2a10" stroke="#e0a43c" stroke-width="1.5"/><text x="720" y="78" font-size="20" font-weight="700" text-anchor="start" fill="#e0a43c">180 °C</text><text x="720" y="96" font-size="12" font-weight="400" text-anchor="start" class="m">branch: T changed</text><text x="720" y="122" font-size="11" font-weight="400" text-anchor="start" class="m">phase</text><text x="720" y="138" font-size="13" font-weight="600" text-anchor="start">pure Sb₂S₃</text><text x="720" y="160" font-size="11" font-weight="400" text-anchor="start" class="m">morphology</text><text x="720" y="176" font-size="12" font-weight="400" text-anchor="start">rough solid spheres</text><text x="720" y="236" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 200 mA/g, 50 cycles</text><rect x="720" y="242" width="69.5" height="12" rx="3" fill="#e0a43c"/><text x="795.459940652819" y="253" font-size="12" font-weight="700" text-anchor="start">532</text><text x="720" y="282" font-size="11" font-weight="400" text-anchor="start" class="m">Li-ion, 500 mA/g, 100 cycles</text><rect x="720" y="288" width="30.6" height="12" rx="3" fill="#e0a43c"/><text x="756.5519287833828" y="299" font-size="12" font-weight="700" text-anchor="start">234</text><text x="720" y="326" font-size="11" font-weight="400" text-anchor="start" class="m">mAh g⁻¹</text><text x="24" y="362" font-size="12" font-weight="400" text-anchor="start">Reading: at 120 °C an oxychloride impurity appears (succeeded = false); 150 °C gives hollow spheres and the best cycling.</text><text x="24" y="382" font-size="12" font-weight="400" text-anchor="start" class="m">Every number here is read from extractions/PMC6199062.json, with its quote; the paper also yields electrode and cell ("device") routes.</text><text x="24" y="402" font-size="11.5" font-weight="400" text-anchor="start" class="m">Query: SELECT * FROM v_route_complete WHERE pmcid = 'PMC6199062' ORDER BY branch_label, step_order;</text></svg>