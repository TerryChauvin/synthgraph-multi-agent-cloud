<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" role="img" aria-label="Pipeline détaillé : consignes et règles de vérification par étape"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#59636e}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#59636e"/></marker></defs><rect x=".5" y=".5" width="879" height="589" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="24" y="32" font-size="16" font-weight="600" text-anchor="start">Le pipeline en détail : ce qu'on demande à chaque étape, et ce qui bloque</text><text x="196" y="66" font-size="13" font-weight="700" text-anchor="start" class="m">Consigne</text><text x="532" y="66" font-size="13" font-weight="700" text-anchor="start" class="m">Règle stricte (vérifiée)</text><rect x="24" y="84" width="160" height="56" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="36" y="108" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">1 Extraction</text><text x="36" y="126" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet, sans web</text><rect x="196" y="84" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="84" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="102" font-size="12" font-weight="400" text-anchor="start">· inventaire de tous les échantillons avant d'écrire</text><text x="206" y="118" font-size="12" font-weight="400" text-anchor="start">· voie de base + une branche par variante comparée</text><text x="206" y="134" font-size="12" font-weight="400" text-anchor="start">· grille v1 : chaque case extraite ou déclarée</text><text x="542" y="102" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ chaque valeur a sa citation mot pour mot</text><text x="542" y="118" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ rien de déduit, converti ou hérité sans texte</text><text x="542" y="134" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ dans le doute : doute écrit, lecture littérale</text><line x1="104" y1="140" x2="104" y2="149" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="150" width="160" height="56" rx="8" fill="#eef1f4" stroke="#6e7781" stroke-width="1.5"/><text x="36" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#6e7781">2 Contrôle</text><text x="36" y="192" font-size="12" font-weight="400" text-anchor="start" class="m">load.py</text><rect x="196" y="150" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="150" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="168" font-size="12" font-weight="400" text-anchor="start">· citations, structure, grille, plages physiques</text><text x="206" y="184" font-size="12" font-weight="400" text-anchor="start">· relancé par l'orchestrateur, jamais cru sur parole</text><text x="542" y="168" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ citation absente du texte → refus</text><text x="542" y="184" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ nombre absent de sa citation → refus</text><text x="542" y="200" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ case ni remplie ni déclarée → refus</text><line x1="104" y1="206" x2="104" y2="215" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="216" width="160" height="56" rx="8" fill="#fbefdc" stroke="#b26a00" stroke-width="1.5"/><text x="36" y="240" font-size="14" font-weight="700" text-anchor="start" fill="#b26a00">3 Relecture</text><text x="36" y="258" font-size="12" font-weight="400" text-anchor="start" class="m">orchestrateur Opus</text><rect x="196" y="216" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="216" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="234" font-size="12" font-weight="400" text-anchor="start">· chaque doute tranché en relisant le passage</text><text x="206" y="250" font-size="12" font-weight="400" text-anchor="start">· 1 publication sur 5 relue valeur par valeur</text><text x="542" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ tirage par hachage du PMCID (non choisi)</text><text x="542" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ erreurs &gt; 5 % → lot relu + règle ajoutée</text><line x1="104" y1="272" x2="104" y2="281" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="282" width="160" height="56" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="36" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">4a Fidélité</text><text x="36" y="324" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet, sans web</text><rect x="196" y="282" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="282" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="300" font-size="12" font-weight="400" text-anchor="start">· lit l'article AVANT l'extraction</text><text x="206" y="316" font-size="12" font-weight="400" text-anchor="start">· cherche : faux, attribution, manquant, déduit</text><text x="542" y="300" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ constat sans passage exact de l'article → refusé</text><text x="542" y="316" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ ne modifie rien</text><line x1="104" y1="338" x2="104" y2="347" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="348" width="160" height="56" rx="8" fill="#fbefdc" stroke="#b26a00" stroke-width="1.5"/><text x="36" y="372" font-size="14" font-weight="700" text-anchor="start" fill="#b26a00">4b Science</text><text x="36" y="390" font-size="12" font-weight="400" text-anchor="start" class="m">Opus + web</text><rect x="196" y="348" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="348" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="366" font-size="12" font-weight="400" text-anchor="start">· stœchiométrie, redox, thermique, solubilité</text><text x="206" y="382" font-size="12" font-weight="400" text-anchor="start">· comparaison aux méthodes fondatrices</text><text x="542" y="366" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ calculs posés pour être recomptés</text><text x="542" y="382" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ source avec DOI, sinon déclarée introuvable</text><line x1="104" y1="404" x2="104" y2="413" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="414" width="160" height="56" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="36" y="438" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">5 Correction</text><text x="36" y="456" font-size="12" font-weight="400" text-anchor="start" class="m">Sonnet</text><rect x="196" y="414" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="414" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="432" font-size="12" font-weight="400" text-anchor="start">· applique les décisions écrites de l'orchestrateur</text><text x="206" y="448" font-size="12" font-weight="400" text-anchor="start">· par script, sur le seul JSON de l'article</text><text x="542" y="432" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ le texte tranche, jamais la majorité</text><text x="542" y="448" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ aucune valeur perdue (contrôle par diff)</text><text x="542" y="464" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ erreur de l'article → annotation, pas correction</text><line x1="104" y1="470" x2="104" y2="479" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="24" y="480" width="160" height="56" rx="8" fill="#eef1f4" stroke="#6e7781" stroke-width="1.5"/><text x="36" y="504" font-size="14" font-weight="700" text-anchor="start" fill="#6e7781">6 Audit</text><text x="36" y="522" font-size="12" font-weight="400" text-anchor="start" class="m">tous les 50 articles</text><rect x="196" y="480" width="324" height="56" rx="6" fill="#ffffff" stroke="#d1d9e0"/><rect x="532" y="480" width="324" height="56" rx="6" fill="#f8e7e3" stroke="#d1d9e0"/><text x="206" y="498" font-size="12" font-weight="400" text-anchor="start">· recontrôle de toutes les citations à leur position</text><text x="206" y="514" font-size="12" font-weight="400" text-anchor="start">· 30 valeurs et 5 stœchiométries relues, sources</text><text x="542" y="498" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ palier suivant seulement à 0 anomalie bloquante</text><text x="542" y="514" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">✓ anomalie acceptée = explication écrite</text><text x="24" y="574" font-size="12" font-weight="400" text-anchor="start" class="m">Chaque agent tient un journal de ses choix ; une erreur vue deux fois devient une règle écrite dans les consignes.</text></svg>