<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="Modèle de données de la base"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#59636e}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#59636e"/></marker></defs><rect x=".5" y=".5" width="879" height="349" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="24" y="34" font-size="16" font-weight="600" text-anchor="start">Modèle de données : voie de base, branches qui changent une variation, une citation par valeur</text><rect x="24" y="60" width="150" height="76" rx="8" fill="#e6f2e9" stroke="#3f7d4e" stroke-width="1.5"/><text x="36" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#3f7d4e">Publication</text><text x="36" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">PMCID, DOI</text><text x="36" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">licence CC, URL</text><rect x="214" y="60" width="190" height="94" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="226" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">Voie de base</text><text x="226" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">matériau, formule, famille</text><text x="226" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">méthode, rendement</text><text x="226" y="136" font-size="12" font-weight="400" text-anchor="start" class="m">type : matériau, dispositif…</text><rect x="374" y="68" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="385" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><rect x="214" y="222" width="190" height="94" rx="8" fill="#fbefdc" stroke="#b26a00" stroke-width="1.5"/><text x="226" y="244" font-size="14" font-weight="700" text-anchor="start" fill="#b26a00">Branche</text><text x="226" y="264" font-size="12" font-weight="400" text-anchor="start" class="m">variante testée par l'auteur</text><text x="226" y="281" font-size="12" font-weight="400" text-anchor="start" class="m">variation : 150 → 180 °C</text><text x="226" y="298" font-size="12" font-weight="400" text-anchor="start" class="m">échecs gardés (succeeded)</text><rect x="374" y="230" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="385" y="245" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><line x1="174" y1="98" x2="212" y2="98" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><path d="M309,222 L309,156" fill="none" stroke="#b26a00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="318" y="194" font-size="12" font-weight="600" text-anchor="start" fill="#b26a00">hérite de</text><text x="318" y="209" font-size="11" font-weight="400" text-anchor="start" class="m">tout le reste</text><rect x="452" y="60" width="190" height="76" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="464" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">Étapes</text><text x="464" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">ordre, action, équipement</text><rect x="612" y="68" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="623" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><rect x="452" y="152" width="190" height="76" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="464" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">Réactifs</text><text x="464" y="194" font-size="12" font-weight="400" text-anchor="start" class="m">rôle, quantité, pureté</text><rect x="612" y="160" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="623" y="175" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><rect x="452" y="244" width="190" height="76" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="464" y="266" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">Résultats</text><text x="464" y="286" font-size="12" font-weight="400" text-anchor="start" class="m">propriété, valeur, conditions</text><text x="464" y="303" font-size="12" font-weight="400" text-anchor="start" class="m">lu dans le texte ou sur figure</text><rect x="612" y="252" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="623" y="267" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><rect x="662" y="60" width="190" height="76" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="674" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#17707f">Paramètres</text><text x="674" y="102" font-size="12" font-weight="400" text-anchor="start" class="m">valeur, unité, valeur SI</text><text x="674" y="119" font-size="12" font-weight="400" text-anchor="start" class="m">T, t, pH, rampe…</text><rect x="822" y="68" width="22" height="18" rx="4" fill="#ffffff" stroke="#6e7781"/><text x="833" y="83" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">❝</text><rect x="662" y="152" width="190" height="76" rx="8" fill="#f8e7e3" stroke="#a8412f" stroke-width="1.5"/><text x="674" y="174" font-size="14" font-weight="700" text-anchor="start" fill="#a8412f">Non dit</text><text x="674" y="194" font-size="12" font-weight="400" text-anchor="start" class="m">par étape et par réactif :</text><text x="674" y="211" font-size="12" font-weight="400" text-anchor="start" class="m">vitesse de chauffe, pression…</text><rect x="662" y="244" width="190" height="76" rx="8" fill="#eef1f4" stroke="#6e7781" stroke-width="1.5"/><text x="674" y="266" font-size="14" font-weight="700" text-anchor="start" fill="#6e7781">Annotations</text><text x="674" y="286" font-size="12" font-weight="400" text-anchor="start" class="m">limites de reproductibilité,</text><text x="674" y="303" font-size="12" font-weight="400" text-anchor="start" class="m">séparées des données</text><path d="M404,98 L428,98 M428,98 L428,282" fill="none" stroke="#59636e" stroke-width="1.6"/><line x1="428" y1="98" x2="450" y2="98" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><line x1="428" y1="190" x2="450" y2="190" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><line x1="428" y1="282" x2="450" y2="282" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><line x1="642" y1="98" x2="660" y2="98" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><path d="M547,136 L547,144 L652,144 L652,190 L660,190" fill="none" stroke="#a8412f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><path d="M404,140 L416,140 L416,330 L757,330 L757,322" fill="none" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><rect x="24" y="168" width="164" height="160" rx="8" fill="#ffffff" stroke="#6e7781" stroke-dasharray="4 3"/><text x="36" y="192" font-size="13" font-weight="700" text-anchor="start" fill="#6e7781">❝ = citation exacte</text><text x="36" y="214" font-size="12" font-weight="400" text-anchor="start" class="m">retrouvée telle quelle</text><text x="36" y="230" font-size="12" font-weight="400" text-anchor="start" class="m">dans le texte ;</text><text x="36" y="246" font-size="12" font-weight="400" text-anchor="start" class="m">le nombre doit figurer</text><text x="36" y="262" font-size="12" font-weight="400" text-anchor="start" class="m">dans la citation ;</text><text x="36" y="278" font-size="12" font-weight="400" text-anchor="start" class="m">conversion SI à part,</text><text x="36" y="294" font-size="12" font-weight="400" text-anchor="start" class="m">jamais à la place</text><text x="36" y="310" font-size="12" font-weight="400" text-anchor="start" class="m">de l'auteur.</text></svg>