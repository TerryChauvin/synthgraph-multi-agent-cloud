<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Multi-agent pipeline: paper, extraction, quote check, two critiques, correction, audit, database"><style>text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#59636e}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#59636e"/></marker></defs><rect x=".5" y=".5" width="879" height="371" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="24" y="34" font-size="16" font-weight="600" text-anchor="start">Every paper goes through six stages; no agent checks its own work</text><rect x="24" y="140" width="108" height="66" rx="8" fill="#e6f2e9" stroke="#3f7d4e" stroke-width="1.5"/><text x="78.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#3f7d4e">Paper</text><text x="78.0" y="180" font-size="12" font-weight="400" text-anchor="middle">open access, CC</text><text x="78.0" y="196" font-size="11" font-weight="400" text-anchor="middle" class="m">+ SI, figures</text><rect x="146" y="140" width="108" height="66" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="200.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#17707f">1 Extraction</text><text x="200.0" y="180" font-size="12" font-weight="400" text-anchor="middle">Sonnet agent</text><text x="200.0" y="196" font-size="11" font-weight="400" text-anchor="middle" class="m">+ what is missing</text><rect x="268" y="140" width="108" height="66" rx="8" fill="#eef1f4" stroke="#6e7781" stroke-width="1.5"/><text x="322.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">2 Check</text><text x="322.0" y="180" font-size="12" font-weight="400" text-anchor="middle">load.py</text><text x="322.0" y="196" font-size="11" font-weight="400" text-anchor="middle" class="m">verbatim quote</text><rect x="390" y="58" width="108" height="66" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="444.0" y="80" font-size="14" font-weight="700" text-anchor="middle" fill="#17707f">3 Fidelity</text><text x="444.0" y="98" font-size="12" font-weight="400" text-anchor="middle">2nd reader</text><text x="444.0" y="114" font-size="11" font-weight="400" text-anchor="middle" class="m">paper read first</text><rect x="390" y="222" width="108" height="66" rx="8" fill="#fbefdc" stroke="#b26a00" stroke-width="1.5"/><text x="444.0" y="244" font-size="14" font-weight="700" text-anchor="middle" fill="#b26a00">4 Science</text><text x="444.0" y="262" font-size="12" font-weight="400" text-anchor="middle">Opus + web</text><text x="444.0" y="278" font-size="11" font-weight="400" text-anchor="middle" class="m">stoichiometry…</text><rect x="512" y="140" width="108" height="66" rx="8" fill="#e3f1f3" stroke="#17707f" stroke-width="1.5"/><text x="566.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#17707f">5 Correction</text><text x="566.0" y="180" font-size="12" font-weight="400" text-anchor="middle">separate agent</text><text x="566.0" y="196" font-size="11" font-weight="400" text-anchor="middle" class="m">fixed / rejected</text><rect x="634" y="140" width="108" height="66" rx="8" fill="#eef1f4" stroke="#6e7781" stroke-width="1.5"/><text x="688.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#6e7781">6 Batch audit</text><text x="688.0" y="180" font-size="12" font-weight="400" text-anchor="middle">every 50 papers</text><text x="688.0" y="196" font-size="11" font-weight="400" text-anchor="middle" class="m">hand re-reading</text><rect x="756" y="140" width="108" height="66" rx="8" fill="#e6f2e9" stroke="#3f7d4e" stroke-width="1.5"/><text x="810.0" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#3f7d4e">Database</text><text x="810.0" y="180" font-size="12" font-weight="400" text-anchor="middle">SQLite</t