<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Reasons for reproducibility limits"><style>.bg{fill:#161b22;stroke:#30363d}.tx{fill:#e6edf3}.mut{fill:#9198a1}.gl{stroke:#30363d}.c1{fill:#3a9fb0}.c2{fill:#d18f1f}.c3{fill:#c9583f}.c4{fill:#4f9a62}.c5{fill:#5d7079}text{font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.t{font-size:15px;font-weight:600}</style><rect class="bg" x=".5" y=".5" width="759" height="309" rx="6"/><text class="tx t" x="16" y="26">Reasons for reproducibility limits</text><text class="mut" x="16" y="44" font-size="12">4,558 annotations, first reason recognised in the text</text><text class="tx" x="252" y="73" text-anchor="end">internal inconsistency in the pap…</text><rect class="c1" x="260" y="61" width="420.0" height="16" rx="2"/><text class="mut" x="686.0" y="73">944</text><text class="tx" x="252" y="97" text-anchor="end">non-discriminating evidence</text><rect class="c1" x="260" y="85" width="208.2" height="16" rx="2"/><text class="mut" x="474.2" y="97">468</text><text class="tx" x="252" y="121" text-anchor="end">interpretation contested</text><rect class="c1" x="260" y="109" width="201.5" height="16" rx="2"/><text class="mut" x="467.5" y="121">453</text><text class="tx" x="252" y="145" text-anchor="end">mass balance / stoichiometry</text><rect class="c1" x="260" y="133" width="192.6" height="16" rx="2"/><text class="mut" x="458.6" y="145">433</text><text class="tx" x="252" y="169" text-anchor="end">supplement not in repository</text><rect class="c1" x="260" y="157" width="142.8" height="16" rx="2"/><text class="mut" x="408.8" y="169">321</text><text class="tx" x="252" y="193" text-anchor="end">missing conditions</text><rect class="c1" x="260" y="181" width="125.5" height="16" rx="2"/><text class="mut" x="391.5" y="193">282</text><text class="tx" x="252" y="217" text-anchor="end">missing amounts</text><rect class="c1" x="260" y="205" width="101.0" height="16" rx="2"/><text class="mut" x="367.0" y="217">227</text><text class="tx" x="252" y="241" text-anchor="end">ambiguous unit or reading</text><rect class="c1" x="260" y="229" width="99.7" height="16" rx="2"/><text class="mut" x="365.7" y="241">224</text><text class="tx" x="252" y="265" text-anchor="end">reviewer's recalculation</text><rect class="c1" x="260" y="253" width="85.0" height="16" rx="2"/><text class="mut" x="351.0" y="265">191</text><text class="tx" x="252" y="289" text-anchor="end">out-of-range value</text><rect class="c1" x="260" y="277" width="83.6" height="16" rx="2"/><text class="mut" x="349.6" y="289">188</text></svg>